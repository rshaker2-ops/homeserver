# Redirect 300zx.org (and www.300zx.org) to shakersoftwareworks.com.
#
# This sits behind Nginx Proxy Manager, which terminates TLS and has already
# matched the hostname, so this block answers everything it is handed and needs
# no server_name of its own. Point the NPM proxy host for 300zx.org at
# 192.168.89.106:8088.
#
# 302 = temporary. Browsers cache a 301 indefinitely, so a premature 301 makes
# "actually, serve a real site at 300zx.org" nearly impossible to undo for
# anyone who visited in the meantime — their browser stops asking. Switch to 301
# only once the redirect is genuinely permanent.
#
# $request_uri preserves the path and query string:
#   300zx.org/parts?year=1990 -> shakersoftwareworks.com/parts?year=1990
# Drop it to send every visitor to the target's homepage instead.
#
# No health-check location: a server-level `return` runs in the server rewrite
# phase, before nginx picks a location, so any location here would be dead code.
# `curl -sI` returning the 302 below is the health check.

server {
    listen 80 default_server;
    access_log off;

    return 302 https://shakersoftwareworks.com$request_uri;
}
