services:
  portal:
    # Prebuilt image published by GitHub Actions from this repo.
    # To build locally instead: docker compose up -d --build
    image: ghcr.io/rshaker2-ops/homeserver-portal:latest
    build: ./portal
    container_name: homeserver-portal
    restart: unless-stopped
    ports:
      - "8899:8899"
    env_file:
      - ./portal/.env
    volumes:
      - portal_data:/data
      # On Unraid, prefer a bind mount on the cache pool instead (SQLite over
      # /mnt/user FUSE shares has locking problems). One-time setup:
      #   mkdir -p /mnt/cache/appdata/portal && chown -R 1000:1000 /mnt/cache/appdata/portal
      # then replace the volume above with:
      # - /mnt/cache/appdata/portal:/data

  # Serves 300zx.org, which redirects to shakersoftwareworks.com.
  # NPM proxy host: 300zx.org + www.300zx.org -> http://192.168.89.106:8088
  # See docs/300zx-org-redirect.md.
  redirect-300zx:
    image: nginx:alpine
    container_name: 300zx-redirect
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./sites/300zx-redirect.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  portal_data:
